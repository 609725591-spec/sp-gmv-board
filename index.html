<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务商经营看板 · 实时GMV</title>
<style>
  :root{
    --bg:#FFF8F2; --card:#FFFFFF; --ink:#2B2118; --sub:#8A7A6A;
    --red:#E82030; --gold:#D4A84E; --goldnum:#C8963E; --line:#F0E4D6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}

  /* ---------- 登录 ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 32px;width:100%;max-width:380px;text-align:center;box-shadow:0 8px 30px rgba(212,168,78,.10)}
  .login-badge{width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin:0 auto 16px}
  .login-card h1{font-size:22px;font-weight:700;margin-bottom:6px}
  .login-card p{font-size:13px;color:var(--sub);margin-bottom:24px}
  #codeInput{width:100%;padding:14px 16px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;outline:none;text-align:center;letter-spacing:2px;background:#FFFDF8}
  #codeInput:focus{border-color:var(--gold)}
  #loginBtn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;background:var(--red);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  #loginBtn:disabled{opacity:.6;cursor:not-allowed}
  #loginErr{margin-top:12px;font-size:13px;color:var(--red);min-height:18px}

  /* ---------- 头部 ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .dot{width:38px;height:38px;border-radius:10px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
  .brand h1{font-size:19px;font-weight:700}
  .brand .pname{font-size:13px;color:var(--sub)}
  .meta{text-align:right;font-size:12px;color:var(--sub);line-height:1.7}
  .meta b{color:var(--goldnum);font-weight:600}
  #logoutBtn{margin-left:10px;padding:6px 12px;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--sub);cursor:pointer}

  /* ---------- 指标卡 ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
  .kpi.red::before{background:var(--red)}
  .kpi .lab{font-size:12px;color:var(--sub);margin-bottom:8px}
  .kpi .val{font-size:26px;font-weight:800;color:var(--goldnum);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .kpi.red .val{color:var(--red)}
  .kpi .sub{font-size:12px;color:var(--sub);margin-top:6px}
  .kpi .sub .up{color:var(--goldnum);font-weight:600}
  .kpi .sub .down{color:var(--red);font-weight:600}

  /* ---------- 明细表 ---------- */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .panel-head h2{font-size:15px;font-weight:700}
  .panel-head h2 span{color:var(--sub);font-weight:400;font-size:12px;margin-left:6px}
  .tools{display:flex;gap:8px;align-items:center}
  #search{padding:8px 12px;font-size:13px;border:1px solid var(--line);border-radius:8px;outline:none;width:180px;background:#FFFDF8}
  #exportBtn{padding:8px 14px;font-size:13px;border:none;border-radius:8px;background:var(--red);color:#fff;cursor:pointer;font-weight:600}
  .tbl-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
  th{background:#FFF3E6;color:#7A5A20;font-weight:600;text-align:left;padding:10px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
  td{padding:10px 10px;border-bottom:1px solid #FAF3EA;white-space:nowrap;color:var(--ink)}
  tr:hover td{background:#FFFBF5}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--goldnum)}
  .empty{padding:40px;text-align:center;color:var(--sub);font-size:14px}
  #loading{padding:40px;text-align:center;color:var(--sub)}
  .foot{margin-top:16px;font-size:11px;color:var(--sub);text-align:center;line-height:1.8}
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login">
  <div class="login-card">
    <div class="login-badge">商</div>
    <h1>服务商经营看板</h1>
    <p>请输入您的专属权限码查看本司实时经营数据</p>
    <input id="codeInput" type="text" placeholder="权限码" autocomplete="off">
    <button id="loginBtn">进入看板</button>
    <div id="loginErr"></div>
  </div>
</div>

<!-- 看板 -->
<div id="board" class="wrap" style="display:none">
  <header>
    <div class="brand">
      <div class="dot">商</div>
      <div>
        <h1>服务商经营看板</h1>
        <div class="pname" id="pname">—</div>
      </div>
    </div>
    <div class="meta">
      数据日期 <b id="mDate">—</b><br>
      更新时间 <span id="mTime">—</span>
      <button id="logoutBtn">退出</button>
    </div>
  </header>

  <div class="kpis">
    <div class="kpi red"><div class="lab">今日支付GMV（元）</div><div class="val" id="kToday">—</div><div class="sub" id="kTodaySub">&nbsp;</div></div>
    <div class="kpi"><div class="lab">日环比</div><div class="val" id="kDod">—</div><div class="sub">对比上一数据日</div></div>
    <div class="kpi"><div class="lab">活动期累计GMV（元）</div><div class="val" id="kPeriod">—</div><div class="sub" id="kPeriodSub">&nbsp;</div></div>
    <div class="kpi"><div class="lab">今日交易门店数</div><div class="val" id="kShops">—</div><div class="sub" id="kShopsSub">&nbsp;</div></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>门店交易明细<span id="tblDate"></span></h2>
      <div class="tools">
        <input id="search" type="text" placeholder="搜索门店/商户名…">
        <button id="exportBtn">导出CSV</button>
      </div>
    </div>
    <div id="loading">加载中…</div>
    <div class="tbl-scroll" id="tblWrap" style="display:none">
      <table>
        <thead><tr>
          <th>区域</th><th>门店名称</th><th>shop_id</th><th>商户主体</th><th>品类</th><th>运维小二</th><th style="text-align:right">支付金额</th><th style="text-align:right">核销金额</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none">暂无数据</div>
  </div>

  <div class="foot">数据为实时口径，可能存在微小波动或延迟，仅用于经营参考。<br>架构/人户关系为 T-1，个别门店可能暂未匹配到运维小二。</div>
</div>

<script>
const SUPABASE_URL = 'https://vtslvpfxjrflutorfryq.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0c2x2cGZ4anJmbHV0b3JmcnlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxOTkzMjEsImV4cCI6MjA5Nzc3NTMyMX0.SeW0gTgIAYEDCZawSU65XNbp--L3CJ3jw7XntymKzdQ';

let ROWS = [];          // 近30天全部明细
let LATEST = [];        // 最新一日明细
let CODE = localStorage.getItem('sp_code') || '';

const $ = id => document.getElementById(id);
const fmt = n => (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('zh-CN', {maximumFractionDigits:0});

async function rpc(fn, args){
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{'apikey':ANON_KEY,'Authorization':'Bearer '+ANON_KEY,'Content-Type':'application/json'},
    body: JSON.stringify(args)
  });
  if(!r.ok) throw new Error('rpc ' + r.status);
  return r.json();
}

async function login(code){
  code = (code||'').trim();
  if(!code) { $('loginErr').textContent='请输入权限码'; return; }
  $('loginBtn').disabled = true; $('loginErr').textContent='';
  try{
    const rows = await rpc('sp_board_read', {p_code: code, p_days: 30});
    if(!Array.isArray(rows) || rows.length===0){ $('loginErr').textContent='权限码无效或暂无数据，请联系对接人'; return; }
    CODE = code; localStorage.setItem('sp_code', code);
    enter(rows);
  }catch(e){ $('loginErr').textContent='校验失败：'+e.message; }
  finally{ $('loginBtn').disabled = false; }
}

function enter(rows){
  ROWS = rows;
  $('login').style.display='none';
  $('board').style.display='block';
  render();
}

function render(){
  const dates = [...new Set(ROWS.map(r=>r.stat_date))].sort();
  const latest = dates[dates.length-1];
  const prev   = dates[dates.length-2];
  LATEST = ROWS.filter(r=>r.stat_date===latest);

  const sum = arr => arr.reduce((s,r)=>s+(Number(r.pay_amt)||0),0);
  const today = sum(LATEST);
  const prevSum = prev ? sum(ROWS.filter(r=>r.stat_date===prev)) : null;
  const period = sum(ROWS);
  const shops = new Set(LATEST.map(r=>r.shop_id)).size;

  $('pname').textContent = LATEST[0] ? (LATEST[0].provider_name) : '';
  $('mDate').textContent = latest;
  $('mTime').textContent = new Date().toLocaleString('zh-CN',{hour12:false});
  $('kToday').textContent = fmt(today);
  $('kPeriod').textContent = fmt(period);
  $('kPeriodSub').textContent = '覆盖 ' + dates.length + ' 个数据日';
  $('kShops').textContent = fmt(shops);
  $('kShopsSub').textContent = '当日有交易门店';
  if(prevSum!=null && prevSum>0){
    const dod = (today-prevSum)/prevSum*100;
    $('kDod').textContent = (dod>=0?'+':'') + dod.toFixed(1) + '%';
    $('kTodaySub').innerHTML = '较上一日 <span class="'+(dod>=0?'up':'down')+'">'+(dod>=0?'+':'')+fmt(today-prevSum)+'</span>';
  } else { $('kDod').textContent='—'; }

  $('tblDate').textContent = '（'+latest+'）';
  drawTable(LATEST);
}

function drawTable(rows){
  const tb = $('tbody');
  if(!rows.length){ $('tblWrap').style.display='none'; $('empty').style.display='block'; return; }
  $('empty').style.display='none'; $('tblWrap').style.display='block';
  tb.innerHTML = rows.map(r=>'<tr>'
    + '<td>'+(r.region||'')+'</td>'
    + '<td>'+(r.shop_name||'')+'</td>'
    + '<td>'+(r.shop_id||'')+'</td>'
    + '<td>'+(r.partner_name||'')+'</td>'
    + '<td>'+(r.l2_srvline||'')+'</td>'
    + '<td>'+(r.ops_staff||'')+'</td>'
    + '<td class="num">'+fmt(r.pay_amt)+'</td>'
    + '<td class="num">'+fmt(r.verify_amt)+'</td>'
    + '</tr>').join('');
}

function exportCSV(){
  const head = ['区域','门店名称','shop_id','商户主体','品类','运维二级部门','运维三级部门','运维四级部门','运维小二','支付金额','核销金额','数据日期'];
  const lines = ['\uFEFF'+head.join(',')];
  LATEST.forEach(r=>{
    const esc = v => { v=(v==null?'':String(v)); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; };
    lines.push([r.region,r.shop_name,r.shop_id,r.partner_name,r.l2_srvline,r.ops_dept2,r.ops_dept3,r.ops_dept4,r.ops_staff,r.pay_amt,r.verify_amt,r.stat_date].map(esc).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '门店交易明细_' + (LATEST[0]?LATEST[0].stat_date:'') + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

$('loginBtn').onclick = ()=>login($('codeInput').value);
$('codeInput').addEventListener('keydown', e=>{ if(e.key==='Enter') login($('codeInput').value); });
$('logoutBtn').onclick = ()=>{ localStorage.removeItem('sp_code'); location.reload(); };
$('exportBtn').onclick = exportCSV;
$('search').oninput = e=>{
  const q = e.target.value.trim();
  drawTable(q ? LATEST.filter(r=>(r.shop_name||'').includes(q)||(r.partner_name||'').includes(q)||(r.shop_id||'').includes(q)) : LATEST);
};

if(CODE){ login(CODE); }
</script>
</body>
</html>
